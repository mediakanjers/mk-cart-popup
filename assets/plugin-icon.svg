<rect x="272" y="196" width="76" height="108" rx="10" fill="#ffca3a"/>
<rect x="302" y="196" width="16" height="108" fill="#f29e00" opacity="0.55"/>
<path d="M272 226H348" fill="none" stroke="#e08e00" stroke-width="4"/>
</g>
</g>
<path class="mk-cart-line" d="M112 148H158L190 304Q193 322 212 322H330Q348 322 352 305L378 202H169"/>
<g class="mk-wheel">
<circle cx="218" cy="372" r="24" fill="#ffffff"/>
<path class="mk-spoke" d="M218 358V386M204 372H232"/>
<circle cx="218" cy="372" r="6" fill="#1f7a3a"/>
</g>
<g class="mk-wheel">
<circle cx="322" cy="372" r="24" fill="#ffffff"/>
<path class="mk-spoke" d="M322 358V386M308 372H336"/>
<circle cx="322" cy="372" r="6" fill="#1f7a3a"/>
</g>
</g>
<g transform="translate(118 96) scale(18)"><path class="mk-spark" d="M0 -1C0.14 -0.14 0.14 -0.14 1 0C0.14 0.14 0.14 0.14 0 1C-0.14 0.14 -0.14 0.14 -1 0C-0.14 -0.14 -0.14 -0.14 0 -1Z"/></g>
<g transform="translate(286 118) scale(11)"><path class="mk-spark mk-s2" d="M0 -1C0.14 -0.14 0.14 -0.14 1 0C0.14 0.14 0.14 0.14 0 1C-0.14 0.14 -0.14 0.14 -1 0C-0.14 -0.14 -0.14 -0.14 0 -1Z"/></g>
<g transform="translate(446 262) scale(14)"><path class="mk-spark mk-s3" d="M0 -1C0.14 -0.14 0.14 -0.14 1 0C0.14 0.14 0.14 0.14 0 1C-0.14 0.14 -0.14 0.14 -1 0C-0.14 -0.14 -0.14 -0.14 0 -1Z"/></g>
<g transform="translate(80 408) scale(12)"><path class="mk-spark mk-s4" d="M0 -1C0.14 -0.14 0.14 -0.14 1 0C0.14 0.14 0.14 0.14 0 1C-0.14 0.14 -0.14 0.14 -1 0C-0.14 -0.14 -0.14 -0.14 0 -1Z"/></g>
<g transform="translate(430 428) scale(9)"><path class="mk-spark mk-s5" d="M0 -1C0.14 -0.14 0.14 -0.14 1 0C0.14 0.14 0.14 0.14 0 1C-0.14 0.14 -0.14 0.14 -1 0C-0.14 -0.14 -0.14 -0.14 0 -1Z"/></g>
<circle class="mk-ring" cx="404" cy="116" r="62"/>
<g class="mk-badge">
<circle cx="404" cy="116" r="62" fill="#ffca3a" stroke="#ffffff" stroke-width="8"/>
