name: Release Plugin

# Draait alleen als je op GitHub een Release publiceert.
# Pushen naar main of dev triggert deze workflow NIET.
on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 1. Builder bouwen ───────────────────────────────────────────────────
      - name: Build
        run: npm ci && npm run build

      # ── 2. Plugin-zip aanmaken ──────────────────────────────────────────────
      # Bevat alleen wat eindgebruikers nodig hebben — geen dev-bestanden.
      - name: Create zip
        run: |
          mkdir -p /tmp/build
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.js' \
            --exclude='.gitignore' \
            --exclude='DEVELOPMENT.md' \
            ./ /tmp/build/mk-cart-popup/
          cd /tmp/build
          zip -r mk-cart-popup.zip mk-cart-popup/

      # ── 3. Zip uploaden naar de GitHub Release ──────────────────────────────
      - name: Upload zip to release
        run: gh release upload ${{ github.ref_name }} /tmp/build/mk-cart-popup.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Update-manifest bijwerken met nieuwe versie + download-URL ───────
      #
      # Een pre-release (GitHub-vinkje "Set as a pre-release") schrijft naar
      # het aparte bèta-manifest, NOOIT naar het stabiele — zo kan publiceren
      # van een bèta nooit per ongeluk de stabiele klantenkring updaten.
      - name: Update manifest
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'EOF'
          import json, os

          tag     = '${{ github.ref_name }}'
          version = tag.lstrip('v')
          is_beta = os.environ['IS_PRERELEASE'] == 'true'

          target = 'mk-cart-popup-update-beta.json' if is_beta else 'mk-cart-popup-update.json'

          # Eerste ooit gepubliceerde pre-release: er is nog geen beta-manifest —
          # gebruik het stabiele manifest als template zodat naam/vereisten/etc.
          # meteen kloppen.
          source = target if os.path.exists( target ) else 'mk-cart-popup-update.json'
          with open( source, 'r' ) as f:
              data = json.load( f )

          data['version']      = version
          data['download_url'] = (
              f'https://github.com/mediakanjers/mk-cart-popup'
              f'/releases/download/{tag}/mk-cart-popup.zip'
          )

          with open( target, 'w' ) as f:
              json.dump( data, f, indent=4, ensure_ascii=False )
              f.write( '\n' )

          print( f'Bijgewerkt: {target}' )
          EOF

      # ── 5. Bijgewerkt manifest committen naar main ──────────────────────────
      - name: Commit manifest
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$IS_PRERELEASE" = "true" ]; then
            TARGET=mk-cart-popup-update-beta.json
          else
            TARGET=mk-cart-popup-update.json
          fi
          git add "$TARGET"
          git commit -m "chore: bump $TARGET to ${{ github.ref_name }}"
          git push origin HEAD:main
